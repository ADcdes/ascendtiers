<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AscendTiers - Minecraft PvP Rankings</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1118;
      --panel: #111821;
      --panel2: #151d28;
      --panel3: #1b2635;
      --line: #1d2a39;
      --line2: #28364a;
      --text: #f6f8fc;
      --muted: #73819a;
      --blue: #9dc6ff;
      --soft-blue: rgba(157,198,255,.14);
      --gold: #ffc42e;
      --silver: #aeb7c4;
      --bronze: #c26a25;
      --red: #ef5b65;
      --green: #65ef93;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      overflow-x: hidden;
    }
    body.loading { overflow: hidden; }
    body::before, body::after {
      content: "";
      position: fixed;
      inset: 0 auto 0 6%;
      width: 1px;
      background: #223247;
      pointer-events: none;
      opacity: .72;
    }
    body::after { left: auto; right: 0; background: #9ab4d8; opacity: .9; }

    button, input, a { font: inherit; }
    button { cursor: pointer; }

    .brand, .nav-item, .discord-link, .search-box, .tab, .rank-row, .rank-card, .tier-chip, .tier-slot, .region-pill, .kit-btn, .tier-person, .profile-action {
      will-change: transform;
    }

    .shell {
      width: min(1540px, calc(100vw - 56px));
      margin: 28px auto 56px;
      animation: shellEnter .46s cubic-bezier(.2,.85,.2,1) both;
    }

    .topbar {
      height: 68px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 22px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, #121a24, #0f161f);
      box-shadow: 0 18px 44px rgba(0,0,0,.2), 0 0 0 1px rgba(255,255,255,.025) inset;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 900;
      letter-spacing: .2px;
      transition: transform .18s ease, filter .18s ease;
    }
    .brand:hover { transform: translateY(-2px) scale(1.03); filter: brightness(1.08); }
    .brand-logo {
      width: 50px;
      height: 50px;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,.55));
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #b7cdf0;
      font-size: 1.12rem;
      font-weight: 600;
    }
    .nav-item {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #b7cdf0;
      text-decoration: none;
      border: 0;
      background: transparent;
      padding: 12px 0;
      border-radius: 10px;
      transition: color .18s ease, background .18s ease, transform .18s ease;
    }
    .nav-item:hover { color: #fff; transform: translateY(-2px); }
    .nav-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }
    .discord-menu { position: relative; }
    .discord-toggle {
      border-radius: 9px;
      padding: 10px 12px;
    }
    .discord-menu:hover .discord-toggle,
    .discord-menu.open .discord-toggle { background: #202a37; }
    .chev { font-size: 1rem; color: #95a6bd; }
    .discord-dropdown {
      position: absolute;
      top: calc(100% + 2px);
      left: 0;
      width: 230px;
      padding: 9px;
      background: #111820;
      border: 2px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 40px rgba(0,0,0,.38);
      opacity: 0;
      transform: translateY(-5px);
      pointer-events: none;
      z-index: 30;
      transition: opacity .18s ease, transform .18s ease;
    }
    .discord-menu:hover .discord-dropdown,
    .discord-menu.open .discord-dropdown {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .discord-link {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 42px;
      color: #b7cdf0;
      text-decoration: none;
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 1.02rem;
      transition: background .16s ease, color .16s ease, transform .16s ease;
    }
    .discord-link:hover { background: #1a2431; color: #fff; transform: translateX(5px); }
    .discord-link .mode-icon { width: 30px; height: 30px; }
    .search-box {
      justify-self: end;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #1d2734;
      border: 0;
      color: #e8eef7;
      position: relative;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .search-box:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0,0,0,.18); }
    .search-box input {
      position: absolute;
      right: 0;
      width: 50px;
      height: 50px;
      border: 0;
      outline: 0;
      border-radius: 10px;
      background: transparent;
      color: transparent;
      padding: 0 48px 0 15px;
      transition: width .18s, background .18s, color .18s;
    }
    .search-box:focus-within input {
      width: min(280px, 70vw);
      background: #1d2734;
      color: #fff;
    }
    .search-box svg { width: 25px; height: 25px; z-index: 1; pointer-events: none; }

    .tabs {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin-top: 38px;
      overflow-x: auto;
      padding: 0 2px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      min-width: 136px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 2px solid var(--line);
      border-bottom: 0;
      border-radius: 20px 20px 0 0;
      background: linear-gradient(180deg, #101820, #0e151e);
      color: #7f8da4;
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
      position: relative;
      transition: background .18s ease, color .18s ease, transform .2s ease, border-color .18s ease;
    }
    .tab:hover {
      color: #dbe9ff;
      border-color: #2c3b50;
      transform: translateY(-2px);
    }
    .tab.active {
      color: #fff;
      background: linear-gradient(180deg, #131d28, #111821);
      transform: translateY(-3px);
      box-shadow: 0 -10px 28px rgba(0,0,0,.16);
    }
    .tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #f3f6fb 12%, #f3f6fb 88%, transparent);
    }
    .mode-icon {
      width: 40px;
      height: 40px;
      display: inline-grid;
      place-items: center;
      line-height: 1;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.35));
    }
    .mode-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .tab:not(.active) .tab-label { display: none; }

    .board {
      background: linear-gradient(180deg, #111821, #101720);
      border: 2px solid var(--line);
      border-radius: 0 12px 12px 12px;
      min-height: 430px;
      overflow: hidden;
      transform-origin: top center;
      box-shadow: 0 22px 55px rgba(0,0,0,.18), 0 0 0 1px rgba(255,255,255,.015) inset;
    }
    .board.content-enter { animation: pageSlideUp .28s cubic-bezier(.2,.85,.2,1) both; }
    .board-head {
      height: 62px;
      display: grid;
      grid-template-columns: 205px minmax(260px, 1fr) 120px minmax(420px, 1.35fr);
      align-items: center;
      padding: 0 28px;
      color: #303b4d;
      font-size: 1.05rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .4px;
      border-bottom: 2px solid #172231;
    }
    .ranking-list { padding: 0 28px 12px; }
    .rank-row {
      display: grid;
      grid-template-columns: 205px minmax(260px, 1fr) 120px minmax(420px, 1.35fr);
      align-items: center;
      min-height: 98px;
      border-bottom: 2px solid #172231;
      cursor: pointer;
      animation: rowSlideUp .34s cubic-bezier(.2,.85,.2,1) both;
      transition: background .16s ease, transform .18s ease, box-shadow .18s ease;
    }
    .rank-row:nth-child(2) { animation-delay: .025s; }
    .rank-row:nth-child(3) { animation-delay: .05s; }
    .rank-row:nth-child(4) { animation-delay: .075s; }
    .rank-row:nth-child(5) { animation-delay: .1s; }
    .rank-row:nth-child(n+6) { animation-delay: .12s; }
    .rank-row:hover {
      background: rgba(255,255,255,.03);
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(0,0,0,.18);
    }

    .rank-card {
      width: 194px;
      height: 66px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      border: 1px solid #1f2d3d;
      background: #182331;
      clip-path: polygon(0 0, 100% 0, 84% 100%, 0 100%);
      transition: transform .18s ease, filter .18s ease;
    }
    .rank-card::before {
      content: "";
      position: absolute;
      inset: -20px;
      background: var(--rank-shimmer, none) center / cover no-repeat;
      opacity: 0;
      mix-blend-mode: screen;
      pointer-events: none;
      transform: translateX(-8px) scale(1.08);
    }
    .rank-row.top-1 .rank-card { --rank-shimmer: url("assets/tiers/rank-1-shimmer.svg"); }
    .rank-row.top-2 .rank-card { --rank-shimmer: url("assets/tiers/rank-2-shimmer.svg"); }
    .rank-row.top-3 .rank-card { --rank-shimmer: url("assets/tiers/rank-3-shimmer.svg"); }
    .rank-row.top-1 .rank-card::before,
    .rank-row.top-2 .rank-card::before,
    .rank-row.top-3 .rank-card::before {
      opacity: .78;
    }
    .rank-row:hover .rank-card { transform: translateX(4px); filter: brightness(1.06); }
    .rank-row:nth-child(1) .rank-card { background: linear-gradient(95deg, #ebb721 0 55%, #ffd54d 55% 100%); }
    .rank-row:nth-child(2) .rank-card { background: linear-gradient(95deg, #9fb2bd 0 55%, #c9d8e0 55% 100%); }
    .rank-row:nth-child(3) .rank-card { background: linear-gradient(95deg, #b55b22 0 55%, #cf742e 55% 100%); }
    .rank-num {
      width: 82px;
      padding-left: 14px;
      z-index: 2;
      font-size: 2.22rem;
      line-height: 1;
      font-weight: 900;
      font-style: italic;
      color: #fff;
      text-shadow: 0 3px 5px rgba(0,0,0,.55);
    }
    .rank-row:nth-child(-n+3) .rank-num { color: #fff; }
    .rank-skin {
      position: absolute;
      right: 16px;
      bottom: -8px;
      width: 80px;
      height: 80px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 10px 9px rgba(0,0,0,.6));
      transition: transform .2s ease;
    }
    .rank-row:hover .rank-skin { transform: translateY(-4px) scale(1.04); }

    .player-name {
      color: #e8f1ff;
      font-size: 1.48rem;
      font-weight: 900;
      line-height: 1.05;
    }
    .rank-row:nth-child(1) .player-name { color: #d9e8ff; }
    .player-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      color: var(--blue);
      font-size: .92rem;
      font-weight: 500;
    }
    .player-title span:last-child { color: #5f718c; }
    .title-badge {
      width: 28px;
      height: 28px;
      object-fit: contain;
      filter: drop-shadow(0 4px 7px rgba(0,0,0,.42));
      flex: 0 0 auto;
    }

    .region-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      height: 42px;
      border-radius: 8px;
      font-size: 1.08rem;
      font-weight: 900;
      background: #522531;
      color: #ff6c7a;
      transition: transform .18s ease, filter .18s ease;
    }
    .rank-row:hover .region-pill, .region-pill:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .region-EU { background: #16491f; color: #6dff86; }
    .region-AS { background: #483060; color: #d9a1ff; }
    .region-AU { background: #5a4817; color: #ffd75c; }

    .tier-slots {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      max-width: 100%;
    }
    .tier-slot, .tier-chip {
      width: 34px;
      height: 68px;
      border-radius: 17px;
    }
    .tier-slot {
      border: 2px dashed #3f4d63;
      background: rgba(0,0,0,.04);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .tier-slot:hover { transform: translateY(-3px); border-color: #56677f; background: rgba(255,255,255,.035); }
    .tier-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #05080d;
      font-size: .72rem;
      font-weight: 900;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.18);
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }
    .tier-chip:hover {
      transform: translateY(-5px) scale(1.04);
      filter: brightness(1.08);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.18), 0 12px 18px rgba(0,0,0,.22);
    }
    .tier-chip .tiny-icon { width: 19px; height: 19px; display: grid; place-items: center; line-height: 1; }
    .tier-chip .tiny-icon svg { width: 100%; height: 100%; display: block; }
    .tier-ht1, .tier-lt1 { background: var(--gold); }
    .tier-ht2, .tier-lt2 { background: #aeb8c5; }
    .tier-ht3, .tier-lt3 { background: #bf6b27; }
    .tier-ht4, .tier-lt4 { background: #61768f; color: #06101d; }
    .tier-ht5, .tier-lt5 { background: #3d5d8e; color: #dce9ff; }
    .chip-tooltip {
      position: fixed;
      background: #131b28;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 8px 14px;
      white-space: nowrap;
      text-align: center;
      pointer-events: none;
      z-index: 200;
      box-shadow: 0 10px 24px rgba(0,0,0,.45);
    }
    .chip-tooltip-title { font-size: .82rem; font-weight: 800; color: #fff; letter-spacing: .01em; }
    .chip-tooltip-sub { font-size: .68rem; font-weight: 600; color: #8b96a8; margin-top: 2px; }

    .empty-state {
      padding: 90px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .mode-board {
      padding: 30px;
    }
    .mode-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }
    .kit-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 48px;
      padding: 0 18px;
      color: #fff;
      background: transparent;
      border: 2px solid #2a3748;
      border-radius: 9px;
      font-size: 1.05rem;
      font-weight: 900;
      text-transform: uppercase;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .kit-btn:hover {
      transform: translateY(-3px);
      border-color: #4a5f7a;
      background: rgba(255,255,255,.035);
    }
    .tier-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .tier-col {
      overflow: hidden;
      border-radius: 10px 10px 0 0;
      background: #172230;
      animation: colSlideUp .34s cubic-bezier(.2,.85,.2,1) both;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .tier-col:nth-child(2) { animation-delay: .035s; }
    .tier-col:nth-child(3) { animation-delay: .07s; }
    .tier-col:nth-child(4) { animation-delay: .105s; }
    .tier-col:nth-child(5) { animation-delay: .14s; }
    .tier-col:hover { transform: translateY(-5px); box-shadow: 0 18px 34px rgba(0,0,0,.2); }
    .tier-col-head {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 1.35rem;
      font-weight: 900;
    }
    .tier-col.t1 .tier-col-head { background: #4b3d16; color: #ffbd32; }
    .tier-col.t2 .tier-col-head { background: #3b414f; color: #c6ced9; }
    .tier-col.t3 .tier-col-head { background: #3a241d; color: #ee965d; }
    .tier-col.t4 .tier-col-head, .tier-col.t5 .tier-col-head { background: #141f2b; color: #b8dfff; }
    .tier-person {
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-top: 2px solid #101821;
      background: #273449;
      color: #fff;
      font-size: .92rem;
      font-weight: 600;
      position: relative;
      cursor: pointer;
      transition: background .16s ease, transform .16s ease, padding-left .16s ease;
    }
    .tier-person:nth-child(odd) { background: #182331; }
    .tier-person:hover { background: #314157; transform: translateX(4px); padding-left: 18px; }
    .tier-person::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ff6170;
    }
    .tier-person.high::before { background: #68ff94; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(3, 7, 12, .78);
      z-index: 100;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      width: 620px;
      max-width: 100%;
      max-height: min(900px, calc(100vh - 40px));
      overflow-y: auto;
      background: #0f151e;
      border: 1px solid #25364b;
      border-radius: 10px;
      padding: 38px 50px 34px;
      position: relative;
      box-shadow: 0 30px 80px rgba(0,0,0,.62);
    }
    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 50%;
      background: #1d2734;
      color: #b9c5d5;
      font-size: 3rem;
      font-weight: 300;
      line-height: 1;
    }
    .modal-close:hover { background: #273548; color: #fff; }
    .modal-top { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 12px; }
    .profile-hero-skin { width: 142px; height: 142px; object-fit: contain; image-rendering: pixelated; border: 2px solid var(--gold); border-radius: 50%; background: #17202d; }
    .modal-name { font-size: 2.25rem; font-weight: 900; color: #d9e8ff; }
    .modal-badge { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 999px; background: #572235; color: #ff9dac; font-size: 1.12rem; font-weight: 800; }
    .modal-title-badge {
      width: 34px;
      height: 34px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.5));
    }
    .modal-region { color: #697993; font-size: 1.1rem; font-weight: 800; }
    .modal-section { margin-top: 30px; }
    .modal-section-title { margin-bottom: 12px; color: #9dc6ff; font-size: 1.45rem; font-weight: 800; text-transform: uppercase; }
    .modal-position { display: grid; grid-template-columns: 116px 1fr; align-items: center; min-height: 62px; overflow: hidden; border: 2px solid #2b3c52; border-radius: 9px; background: #151e2a; }
    .modal-position-rank { align-self: stretch; display: grid; place-items: center; color: #fff; background: linear-gradient(105deg, #f6c33c 0 76%, #d79b22 76% 100%); font-size: 2.3rem; font-style: italic; font-weight: 900; text-shadow: 0 3px 4px rgba(0,0,0,.28); clip-path: polygon(0 0, 100% 0, 84% 100%, 0 100%); }
    .modal-position-label { display: flex; align-items: center; gap: 10px; padding: 0 20px; color: #fff; font-size: 1.45rem; font-weight: 900; }
    .modal-position-label span { color: #9bb4d7; font-size: 1.1rem; font-weight: 600; }
    .modal-tier-rack { display: flex; min-height: 103px; align-items: center; gap: 10px; overflow-x: auto; padding: 10px; border: 2px solid #2b3c52; border-radius: 9px; background: #151e2a; }
    .modal-tier-chip, .modal-tier-slot { width: 47px; height: 80px; flex: 0 0 47px; border-radius: 24px; }
    .modal-tier-chip { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #0a111a; font-size: .92rem; font-weight: 900; box-shadow: inset 0 0 0 3px rgba(12,20,32,.18); }
    .modal-tier-chip .tiny-icon { width: 27px; height: 27px; display: grid; place-items: center; }
    .modal-tier-chip .tiny-icon svg { width: 100%; height: 100%; }
    .modal-tier-slot { border: 2px dashed #3b4d65; background: #131c28; }
    .modal-restricted { margin-top: 12px; color: #ff6975; }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(157,198,255,.08), transparent 34%),
        #0b1118;
      transition: opacity .36s ease, visibility .36s ease;
    }
    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-card {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #dbe8fb;
      font-size: .88rem;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
      animation: loaderLift .55s cubic-bezier(.2,.85,.2,1) both;
    }
    .loader-cup {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(180deg, #151f2b, #101720);
      border: 2px solid var(--line);
      font-size: 1.55rem;
      box-shadow: 0 16px 35px rgba(0,0,0,.28), 0 0 0 5px rgba(157,198,255,.035);
      animation: loaderPulse 1.1s ease-in-out infinite;
    }
    .loader-line {
      position: relative;
      width: 180px;
      height: 2px;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: #1a2634;
    }
    .loader-line::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 45%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, #9dc6ff, transparent);
      animation: loaderSweep 1.2s ease-in-out infinite;
    }

    @keyframes pageSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shellEnter {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes rowSlideUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes colSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes loaderLift {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes loaderPulse {
      0%, 100% { transform: translateY(0) scale(1); filter: brightness(1); }
      50% { transform: translateY(-2px) scale(1.025); filter: brightness(1.12); }
    }
    @keyframes loaderSweep {
      from { transform: translateX(-120%); }
      to { transform: translateX(260%); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }

    @media (max-width: 1050px) {
      .shell { width: min(100vw - 24px, 900px); margin-top: 18px; }
      .topbar { grid-template-columns: auto 1fr auto; gap: 12px; }
      .nav { justify-content: center; gap: 10px; font-size: 1rem; }
      .nav-item span:not(.chev) { display: none; }
      .tab { min-width: 94px; height: 72px; border-radius: 18px 18px 0 0; }
      .tab-label { display: none; }
      .board-head { display: none; }
      .ranking-list { padding: 0 12px 12px; }
      .rank-row {
        grid-template-columns: 120px 1fr;
        gap: 12px;
        padding: 14px 0;
      }
      .rank-card { width: 120px; height: 64px; }
      .rank-num { width: 54px; font-size: 2rem; }
      .rank-skin { right: 5px; width: 70px; height: 70px; }
      .region-pill, .tier-slots { grid-column: 2; }
      .tier-grid { grid-template-columns: 1fr; }
      .modal-card { padding: 32px 20px 24px; }
      .modal-close { top: 12px; right: 12px; width: 46px; height: 46px; font-size: 2.35rem; }
      .profile-hero-skin { width: 116px; height: 116px; }
      .modal-name { font-size: 1.85rem; }
      .modal-position { grid-template-columns: 92px 1fr; }
      .modal-position-label { padding: 0 14px; font-size: 1.1rem; }
      .modal-position-label span { font-size: .9rem; }
    }
  </style>
</head>

    Mace: (s=28) => `<svg width="${s}" height="${s}" viewBox="0 0 750 750" xmlns="http://www.w3.org/2000/svg"><path fill="#60606b" style="opacity:.988" d="M574.5 131.5a50 50 0 0 1 2.5 7 373 373 0 0 1 15.5 17q-.69 7.764-4.5 15a820 820 0 0 1-42.5 41 108 108 0 0 0-8 9.5 23 23 0 0 1-5 2l-56 56a7463 7463 0 0 0-14 12l-61 61q-3.822 3.663-9 5-8.923.306-17.5-2.5l-1.5.5q1.129 1.006 1 2.5-10.083-13.843-23-25.5a28 28 0 0 1-4-1.5 9331 9331 0 0 0-83-101q-5.832-15.26 7-25.5a20587 20587 0 0 1 179-166q9-5 18 0a11266 11266 0 0 0 106 93.5"/><path fill="#5b5b6d" style="opacity:.973" d="M618.5 176.5a147 147 0 0 1-8-2.5 157.7 157.7 0 0 0-18-18.5 373 373 0 0 0-15.5-17 50 50 0 0 0-2.5-7q-.25-30.005.5-60 2.913-9.414 12.5-11.5a2209 2209 0 0 1 94 0q7.75 1.75 9.5 9.5l.5 47q.207 25.575-1.5 51-3.333 5.832-9.5 8.5-30.996.75-62 .5"/><path fill="#444451" d="M459.5 109.5q13.206-.54 15 12.5a495 495 0 0 1-6.5 33.5 409.5 409.5 0 0 1-10.5 61 103 103 0 0 0-7 6.5 1746 1746 0 0 0-98 20q-9.29 2.567-15.5-4.5a25.2 25.2 0 0 1 0-10q6.556-9.711 16.5-16.5a15647 15647 0 0 0 106-102.5"/><path fill="#4d4d5c" style="opacity:.993" d="M592.5 155.5a157.7 157.7 0 0 1 18 18.5q4.126 1.414 8 2.5 30.047 33.787 65.5 64a796 796 0 0 1 32 35q7.39 10.42-1 20A20370 20370 0 0 1 548.5 467a59.5 59.5 0 0 1-13.5 4.5 38.5 38.5 0 0 1-14.5-5.5 454 454 0 0 1-41-28 2997 2997 0 0 0-58-39.5q-1.977-5.748-7-9.5a259 259 0 0 1-40-31.5q.129-1.494-1-2.5l1.5-.5q8.577 2.806 17.5 2.5 5.178-1.337 9-5l61-61a7463 7463 0 0 1 14-12l56-56a23 23 0 0 0 5-2 108 108 0 0 1 8-9.5 820 820 0 0 0 42.5-41q3.81-7.236 4.5-15"/><path fill="#444451" d="M632.5 274.5q13.521-3.004 17 10a41.8 41.8 0 0 1-3.5 8Q588.33 348.168 530.5 404q-14.645 8.784-18-8 6.668-41.755 13.5-83.5-.579-16.673 15.5-19.5a3134 3134 0 0 0 91-18.5"/><path fill="#9191b7" style="opacity:.961" d="M347.5 330.5q1.899.885 4 1.5 12.917 11.657 23 25.5a259 259 0 0 0 40 31.5q5.023 3.752 7 9.5a2385 2385 0 0 1-59 57q-5.56 2.784-10 7.5.834.574 1 1.5-5 6-11 11-1.22-1.73-3 0-1.393 1.783-1 4l-6 5h-3v3a148891 148891 0     const MODES = ['Overall','Vanilla','UHC','Pot','NethOP','SMP','Sword','Axe','Mace'];
    const GAME_MODES = ['Vanilla','UHC','Pot','NethOP','SMP','Sword','Axe','Mace'];
    const TIER_ORDER = ['HT1','LT1','HT2','LT2','HT3','LT3','HT4','LT4','HT5','LT5'];
    const TIER_POINTS = {HT1:60,LT1:45,HT2:30,LT2:20,HT3:10,LT3:6,HT4:4,LT4:3,HT5:2,LT5:1};
    const TITLE_BADGES = {
      'Combat Grandmaster': 'assets/tiers/combat-grandmaster.png',
      'Combat Master': 'assets/tiers/combat-master.png',
      'Combat Ace': 'assets/tiers/combat-ace.svg',
      'Combat Specialist': 'assets/tiers/combat-specialist.svg',
      'Combat Cadet': 'assets/tiers/combat-cadet.svg',
      'Combat Novice': 'assets/tiers/combat-novice.svg',
      Rookie: 'assets/tiers/rookie.svg'
    };

    let currentMode = 'Overall';
    let players = {};
    let openedFromUrl = false;
    let siteHtmlSnapshot = null;

    function modeIcon(mode) {
      return `<span class="mode-icon">${ICONS[mode] ? ICONS[mode](44) : ''}</span>`;
    }
    function playerIgn(p) { return p.ign || p.name || ''; }
    function playerIdentity(p) { return p.uuid || playerIgn(p); }
    function craftyIdentity(p) {
      const value = String(playerIdentity(p));
      return /^[a-f0-9]{32}$/i.test(value) ? value.replace(/^(........)(....)(....)(....)(............)$/, '$1-$2-$3-$4-$5') : value;
    }
    function bustUrl(p) { return `https://render.crafty.gg/3d/bust/${encodeURIComponent(craftyIdentity(p))}`; }
    function avatarUrl(p, size = 160) { return `https://mc-heads.net/avatar/${encodeURIComponent(playerIdentity(p))}/${size}`; }
    function playerPoints(p) {
      return Object.values(mergedTiers(p)).reduce((sum, tier) => sum + (TIER_POINTS[tier] || 0), 0);
    }
    function mergedTiers(p) {
      return { ...(p.retiredTiers || {}), ...(p.tiers || {}) };
    }
    function isRetiredTierMode(p, mode) {
      return !!(p.retiredTiers && p.retiredTiers[mode]) && !(p.tiers && p.tiers[mode]);
    }
    function bestTier(p) {
      const tiers = Object.values(p.tiers || {});
      return tiers.sort((a,b) => TIER_ORDER.indexOf(a) - TIER_ORDER.indexOf(b))[0] || 'LT5';
    }
    function getTitle(points) {
      if (points >= 450) return 'Combat Grandmaster';
      if (points >= 300) return 'Combat Master';
      if (points >= 180) return 'Combat Ace';
      if (points >= 90) return 'Combat Specialist';
      if (points >= 30) return 'Combat Cadet';
      if (points >= 10) return 'Combat Novice';
      return 'Rookie';
    }
    function sortedPlayers() { return Object.values(players).filter(p => Object.keys(mergedTiers(p)).length > 0).sort((a,b) => playerPoints(b) - playerPoints(a)); }
    function escapeText(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function jsString(value) {
      return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }
    function titleBadge(title, className = 'title-badge') {
      const src = TITLE_BADGES[title];
      return src ? `<img class="${className}" src="${src}" alt="${escapeText(title)}">` : '';
    }

    function renderDiscords() {
      document.getElementById('discord-dropdown').innerHTML = Object.entries(DISCORDS).map(([name, url]) => `
        <a class="discord-link" href="${url}" target="_blank" rel="noopener">
          ${modeIcon(name === 'Main' ? 'Overall' : name)}
          <span>${name}</span>
        </a>`).join('');
    }
    function toggleDiscordMenu(event) {
      event.preventDefault();
      document.getElementById('discord-menu').classList.toggle('open');
    }
    document.addEventListener('click', event => {
      if (!event.target.closest('#discord-menu')) document.getElementById('discord-menu').classList.remove('open');
    });

    function renderTabs() {
      document.getElementById('tabs').innerHTML = MODES.map(mode => `
        <button class="tab ${mode === currentMode ? 'active' : ''}" onclick="setMode('${mode}')">
          ${modeIcon(mode)}
          <span class="tab-label">${mode}</span>
        </button>
      `).join('');
    }
    function setMode(mode) {
      if (mode === currentMode) return;
      currentMode = mode;
      renderTabs();
      render(true);
    }
    function onSearch() { render(false); }

    let activeChipTooltip = null;
    function showChipTooltip(el, title, sub) {
      hideChipTooltip();
      const tip = document.createElement('div');
      tip.className = 'chip-tooltip';
      tip.innerHTML = `<div class="chip-tooltip-title">${escapeText(title)}</div><div class="chip-tooltip-sub">${escapeText(sub)}</div>`;
      document.body.appendChild(tip);
      const rect = el.getBoundingClientRect();
      const tipRect = tip.getBoundingClientRect();
      let left = rect.left + rect.width / 2 - tipRect.width / 2;
      left = Math.max(6, Math.min(left, window.innerWidth - tipRect.width - 6));
      tip.style.left = `${left}px`;
      tip.style.top = `${rect.top - tipRect.height - 10}px`;
      activeChipTooltip = tip;
    }
    function hideChipTooltip() {
      if (activeChipTooltip) { activeChipTooltip.remove(); activeChipTooltip = null; }
    }

    function tierChip(mode, tier, extraClass = '', retired = false) {
      const cls = `tier-${tier.toLowerCase()}`;
      const points = TIER_POINTS[tier] || 0;
      const title = retired ? `Retired ${tier}` : tier;
      const sub = `${points} point${points === 1 ? '' : 's'}`;
      return `<div class="tier-chip ${cls} ${extraClass}" onmouseenter="showChipTooltip(this,'${jsString(title)}','${jsString(sub)}')" onmouseleave="hideChipTooltip()">
        <span class="tiny-icon">${ICONS[mode] ? ICONS[mode](22) : ''}</span>
        <span>${tier}</span>
      </div>`;
    }
    function emptySlots(count) {
      return Array.from({length: count}, () => `<div class="tier-slot"></div>`).join('');
    }
    function tierSlots(p) {
      const merged = mergedTiers(p);
      const entries = GAME_MODES.filter(mode => merged[mode]).map(mode => tierChip(mode, merged[mode], '', isRetiredTierMode(p, mode)));
      const max = 8;
      return `${entries.slice(0, max).join('')}${emptySlots(Math.max(0, max - entries.length))}`;
    }
    function modalTierSlots(p) {
      const merged = mergedTiers(p);
      const entries = GAME_MODES.filter(mode => merged[mode]).map(mode => {
        const tier = merged[mode];
        const retired = isRetiredTierMode(p, mode);
        const points = TIER_POINTS[tier] || 0;
        const title = retired ? `Retired ${tier}` : tier;
        const sub = `${points} point${points === 1 ? '' : 's'}`;
        return `<div class="modal-tier-chip tier-${tier.toLowerCase()}" onmouseenter="showChipTooltip(this,'${jsString(title)}','${jsString(sub)}')" onmouseleave="hideChipTooltip()">
          <span class="tiny-icon">${ICONS[mode] ? ICONS[mode](28) : ''}</span><span>${tier}</span>
        </div>`;
      });
      return `${entries.slice(0, 8).join('')}${Array.from({length: Math.max(0, 8 - entries.length)}, () => '<div class="modal-tier-slot"></div>').join('')}`;
    }
    function regionName(region) {
      return ({ NA: 'North America', EU: 'Europe', AS: 'Asia', AU: 'Australia' })[region] ?? region ?? 'Unknown Region';
    }

    function animateContent() {
      const content = document.getElementById('content');
      content.classList.remove('content-enter');
      void content.offsetWidth;
      content.classList.add('content-enter');
    }

    function finishLoading() {
      document.body.classList.remove('loading');
      document.getElementById('loading-screen')?.classList.add('hidden');
    }

    function render(animate = false) {
      const query = document.getElementById('search').value.toLowerCase().trim();
      const list = Object.values(players).filter(p => playerIgn(p).toLowerCase().includes(query));
      if (currentMode === 'Overall') renderOverall(list);
      else renderMode(list, currentMode);
      if (animate) animateContent();
    }

    function renderOverall(fullList) {
      const list = fullList.filter(p => Object.keys(mergedTiers(p)).length > 0).sort((a,b) => playerPoints(b) - playerPoints(a));
      if (!list.length) {
        document.getElementById('content').innerHTML = `<div class="empty-state">No players found.</div>`;
        return;
      }
      const rows = list.map((p, index) => {
        const ign = playerIgn(p);
        const points = playerPoints(p);
        const title = getTitle(points);
        return `<div class="rank-row top-${index + 1}" onclick="showPlayerByIgn('${jsString(ign)}')">
          <div class="rank-card">
            <div class="rank-num">${index + 1}.</div>
            <img class="rank-skin" src="${bustUrl(p)}" loading="lazy" onerror="this.onerror=null;this.src='${avatarUrl(p)}'">
          </div>
          <div>
            <div class="player-name">${escapeText(ign)}</div>
            <div class="player-title">${titleBadge(title)}<span>${title} (${points} points)</span></div>
          </div>
          <span class="region-pill region-${escapeText(p.region || 'NA')}">${escapeText(p.region || 'NA')}</span>
          <div class="tier-slots">${tierSlots(p)}</div>
        </div>`;
      }).join('');
      document.getElementById('content').innerHTML = `
        <div class="board-head"><div>#</div><div>Player</div><div>Region</div><div>Tiers</div></div>
        <div class="ranking-list">${rows}</div>
      `;
    }

    function renderMode(list, mode) {
      const cols = {1:[],2:[],3:[],4:[],5:[]};
      list.forEach(player => {
        const tier = mergedTiers(player)[mode];
        if (!tier) return;
        const num = Number(tier.replace(/\D/g, ''));
        if (cols[num]) cols[num].push({...player, tier, retired: isRetiredTierMode(player, mode)});
      });
      Object.values(cols).forEach(col => col.sort((a,b) => TIER_ORDER.indexOf(a.tier) - TIER_ORDER.indexOf(b.tier) || playerIgn(a).localeCompare(playerIgn(b))));
      const grid = Object.entries(cols).map(([tierNum, tierPlayers]) => `
        <div class="tier-col t${tierNum}">
          <div class="tier-col-head"><span>Tier ${tierNum}</span></div>
          ${tierPlayers.length ? tierPlayers.map(p => `
            <div class="tier-person ${p.tier.startsWith('HT') ? 'high' : 'low'}" onclick="showPlayerByIgn('${jsString(playerIgn(p))}')" onmouseenter="${p.retired ? `showChipTooltip(this,'${jsString('Retired ' + p.tier)}','${jsString(mode)}')` : ''}" onmouseleave="${p.retired ? 'hideChipTooltip()' : ''}">${escapeText(playerIgn(p))}</div>
          `).join('') : `<div class="tier-person">No players yet</div>`}
        </div>
      `).join('');
      document.getElementById('content').innerHTML = `
        <div class="mode-board">
          <div class="mode-toolbar"><button class="kit-btn" onclick="alert('${mode} kit details coming soon.')">ⓘ Show Kit</button></div>
          <div class="tier-grid">${grid}</div>
        </div>
      `;
    }

    function profileUrl(ign) {
      const url = new URL(window.location.href);
      url.searchParams.set('player', ign);
      return url.toString();
    }
    function setPlayerUrl(ign) {
      const url = new URL(window.location.href);
      url.searchParams.set('player', ign);
      history.pushState({player: ign}, '', url);
    }
    function clearPlayerUrl() {
      const url = new URL(window.location.href);
      url.searchParams.delete('player');
      history.pushState({}, '', url.pathname + (url.search ? url.search : '') + url.hash);
    }
    function showPlayerByIgn(ign) {
      const p = Object.values(players).find(player => playerIgn(player) === ign);
      if (p) showModal(p);
    }
    function showModal(p, updateUrl = true) {
      const ign = playerIgn(p);
      const points = playerPoints(p);
      const title = getTitle(points);
      const pos = sortedPlayers().findIndex(player => playerIgn(player) === ign) + 1;
      if (updateUrl) setPlayerUrl(ign);
      document.getElementById('modal-body').innerHTML = `
        <div class="modal-top">
          <img class="profile-hero-skin" src="${bustUrl(p)}" loading="eager" onerror="this.onerror=null;this.src='${avatarUrl(p, 160)}'">
          <div class="modal-name">${escapeText(ign)}</div>
          <div class="modal-badge">${titleBadge(title, 'modal-title-badge')}<span>${title}</span></div>
          <div class="modal-region">${escapeText(regionName(p.region))}</div>
        </div>
        <section class="modal-section">
          <h2 class="modal-section-title">Position</h2>
          <div class="modal-position">
            <div class="modal-position-rank">${pos > 0 ? `${pos}.` : '-'}</div>
            <div class="modal-position-label"><span aria-hidden="true">🏆</span> OVERALL <span>(${points} points)</span></div>
          </div>
        </section>
        <section class="modal-section">
          <h2 class="modal-section-title">Tiers</h2>
          <div class="modal-tier-rack">${modalTierSlots(p)}</div>
          ${p.retireReason ? `<div class="modal-restricted">${escapeText(p.retireReason)}</div>` : ''}
        </section>
        ${p.restricted ? `<div class="modal-restricted">Restricted${p.restrictReason ? ': ' + escapeText(p.restrictReason) : ''}</div>` : ''}
      `;
      document.getElementById('modal-overlay').classList.add('open');
    }
    function closeModal(e) {
      if (e && e.target !== document.getElementById('modal-overlay') && !e.target.classList.contains('modal-close')) return;
      document.getElementById('modal-overlay').classList.remove('open');
      clearPlayerUrl();
    }
    window.addEventListener('popstate', openProfileFromUrl);
    function openProfileFromUrl() {
      const ign = new URLSearchParams(window.location.search).get('player');
      if (!ign) return;
      const p = Object.values(players).find(player => playerIgn(player).toLowerCase() === ign.toLowerCase());
      if (p) showModal(p, false);
    }

    async function refresh() {
      try {
        const res = await fetch(`players.json?t=${Date.now()}`);
        const data = await res.json();
        players = data.players || {};
      } catch (error) {
        players = {};
      }
      renderDiscords();
      renderTabs();
      render(!openedFromUrl);
      if (!openedFromUrl) {
        openedFromUrl = true;
        openProfileFromUrl();
        finishLoading();
      }
    }
    async function checkSiteUpdate() {
      if (!/^https?:$/.test(window.location.protocol)) return;
      try {
        const res = await fetch(`${window.location.pathname || '/'}?site=${Date.now()}`, {cache: 'no-store'});
        const html = await res.text();
        if (!html) return;
        if (siteHtmlSnapshot === null) {
          siteHtmlSnapshot = html;
          return;
        }
        if (html !== siteHtmlSnapshot) window.location.reload();
      } catch (error) {}
    }
    refresh();
    setInterval(refresh, 30000);
    checkSiteUpdate();
    setInterval(checkSiteUpdate, 60000);
  </script>
